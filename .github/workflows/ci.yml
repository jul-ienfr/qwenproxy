name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Mock tests
        run: npm run test:mock
        env:
          CI: true
          TEST_MOCK_QWEN_AUTH: true

  standalone:
    name: Standalone (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            asset: qwenproxy-windows-x64.exe
          - target: linux-x64
            os: ubuntu-latest
            asset: qwenproxy-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            asset: qwenproxy-linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Build standalone binary
        shell: bash
        run: node scripts/build-standalone.mjs --target=${{ matrix.target }} --no-checksums
        env:
          QWENPROXY_BUILD_COMMIT: ${{ github.sha }}
          QWENPROXY_BUILD_DATE: ${{ github.event.head_commit.timestamp }}

      - name: Smoke test --version
        if: matrix.target != 'linux-arm64'
        shell: bash
        run: ./dist/standalone/${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: dist/standalone/${{ matrix.asset }}
          if-no-files-found: error

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        id: secrets
        run: echo "available=${{ secrets.DOCKERHUB_USERNAME != '' }}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
        if: steps.secrets.outputs.available == 'true'

      - uses: docker/login-action@v3
        if: steps.secrets.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.secrets.outputs.available == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            QWENPROXY_VERSION=${{ steps.meta.outputs.version }}
            QWENPROXY_COMMIT=${{ github.sha }}
            QWENPROXY_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            johngbl/qwenproxy:latest
            johngbl/qwenproxy:${{ github.sha }}
            johngbl/qwenproxy:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (smoke test)
        if: steps.secrets.outputs.available != 'true'
        run: |
          docker build \
            --build-arg QWENPROXY_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg QWENPROXY_COMMIT="${{ github.sha }}" \
            --build-arg QWENPROXY_BUILD_DATE="${{ github.event.head_commit.timestamp }}" \
            --tag qwenproxy:test .

  release:
    name: Auto Release & NPM Publish
    runs-on: ubuntu-latest
    needs: [check, standalone]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Download standalone binaries
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: dist/standalone
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: node scripts/checksums.mjs dist/standalone

      - name: Check version and tag status
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          TAG="v$VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🚀 New version $TAG detected! Proceeding with release."
          fi

      - name: Create Git Tag and GitHub Release
        if: steps.check_version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_version.outputs.tag }}
        run: |
          TAG="${{ steps.check_version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # Generate standardized English release notes from commit history
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const tag = process.env.TAG;
            const prevTag = process.env.PREV_TAG;
            const range = prevTag ? `${prevTag}..HEAD` : "HEAD";
            let rawLog = "";
            try {
              rawLog = execSync(`git log ${range} --pretty=format:"%B---COMMIT_DELIMITER---"`, { encoding: "utf-8" });
            } catch {}

            const commits = rawLog.split("---COMMIT_DELIMITER---").map(c => c.trim()).filter(Boolean);
            const features = [];
            const fixes = [];
            const other = [];

            for (const c of commits) {
              const lines = c.split("\n").map(l => l.trim()).filter(Boolean);
              if (lines.length === 0) continue;
              const header = lines[0];
              const bullets = lines.slice(1).filter(l => l.startsWith("-") || l.startsWith("*"));
              const target = header.startsWith("fix") ? fixes : header.startsWith("feat") ? features : other;
              target.push({ header, bullets });
            }

            let body = "";
            if (features.length > 0) {
              body += "### 🚀 Features & Enhancements\n";
              for (const item of features) {
                body += `- **${item.header}**\n`;
                for (const b of item.bullets) body += `  ${b}\n`;
              }
              body += "\n";
            }
            if (fixes.length > 0) {
              body += "### 🛠️ Bug Fixes\n";
              for (const item of fixes) {
                body += `- **${item.header}**\n`;
                for (const b of item.bullets) body += `  ${b}\n`;
              }
              body += "\n";
            }
            if (other.length > 0) {
              body += "### 📦 Other Changes\n";
              for (const item of other) {
                body += `- **${item.header}**\n`;
                for (const b of item.bullets) body += `  ${b}\n`;
              }
              body += "\n";
            }
            body += "### 📦 Standalone binaries\n";
            body += "Download the asset for your platform, verify it, then check the embedded version:\n";
            body += "```bash\nsha256sum -c SHA256SUMS\n./qwenproxy-<platform> --version\n```\n";
            body += "Standalone binaries do not bundle Chromium: install Node.js and run `npx patchright install chromium`, or use the Docker image, which includes it. Existing npm and Docker installs remain supported; back up the `data/` directory before upgrading and follow any breaking-change note above.\n\n";
            if (prevTag) {
              body += `**Full Changelog**: https://github.com/jul-ienfr/qwenproxy/compare/${prevTag}...${tag}\n`;
            }
            fs.writeFileSync("RELEASE_NOTES.md", body.trim() || `Release ${tag}\n`, "utf-8");
          '
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md \
            dist/standalone/qwenproxy-* dist/standalone/SHA256SUMS

      - name: Publish to NPM Registry
        if: steps.check_version.outputs.exists == 'false' && env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
