openapi: 3.1.0
info:
  title: QwenProxy API
  description: |
    OpenAI-compatible reverse proxy for Qwen models with account rotation,
    tool calling, multimodal upload, and streaming support.
  version: 1.0.0
  contact:
    name: QwenProxy
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development server

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Creates a model response for the given chat conversation
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatCompletionRequest"
            examples:
              simple:
                summary: Simple text completion
                value:
                  model: qwen3-max
                  messages:
                    - role: user
                      content: Hello
              streaming:
                summary: Streaming response
                value:
                  model: qwen3-max
                  messages:
                    - role: user
                      content: Explain quantum computing
                  stream: true
              multimodal:
                summary: Image input
                value:
                  model: qwen3-vl-max
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image
                        - type: image_url
                          image_url:
                            url: https://example.com/image.jpg
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatCompletionStreamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"

  /v1/chat/completions/stop:
    post:
      operationId: stopChatCompletion
      summary: Abort an in-flight streaming chat completion
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopChatCompletionRequest"
      responses:
        "200":
          description: Stream stopped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/upload:
    post:
      operationId: uploadFile
      summary: Upload a file to Alibaba Cloud OSS for multimodal prompts
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The file to upload. Supported types: images (png, jpg, gif, webp),
                    video (mp4, mov, avi, webm, mkv), audio (mp3, wav, ogg, flac, m4a, aac),
                    documents (pdf, doc, docx, xls, xlsx, ppt, pptx, txt, md, csv, json, xml, html, zip).
                    Max size: 100MB video, 50MB audio, 20MB other.
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/images/generations:
    post:
      operationId: createImage
      summary: Generate an image from a prompt
      tags:
        - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationRequest"
      responses:
        "200":
          description: Generated image(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/images/edits:
    post:
      operationId: createImageEdit
      summary: Edit an uploaded image with a prompt
      description: |
        Accepts multipart form data with the base `image` and a `prompt`. The
        image is uploaded through the same Qwen OSS path used by
        `/v1/upload` and attached to an upstream `image_edit` chat. The same
        account pool, quotas, cooldowns and captcha recovery as image/video
        generation apply.

        `size` is accepted for OpenAI compatibility but is not forwarded
        upstream. `mask` is not supported by the Qwen backend and is rejected
        with a 400. Upstream moderation failures return
        `400` with `code: content_policy_violation`.
      tags:
        - Images
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageEditRequest"
      responses:
        "200":
          description: Edited image(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/models:
    get:
      operationId: listModels
      summary: Lists the currently available models
      description: |
        OpenAI list format with the synthetic `-fast` variant for every model.
      tags:
        - Models
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: ETag value for conditional GET. Returns 304 if unchanged.
      responses:
        "200":
          description: List of models
          headers:
            ETag:
              schema:
                type: string
              description: MD5-based entity tag (OpenAI format)
            Cache-Control:
              schema:
                type: string
              description: Cache policy (public, max-age=3600)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "304":
          description: Not modified (ETag match)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/models/{model}:
    get:
      operationId: retrieveModel
      summary: Retrieves a model instance by ID
      tags:
        - Models
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
          description: The ID of the model to retrieve
      responses:
        "200":
          description: The model object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/responses:
    post:
      operationId: createResponse
      summary: OpenAI Responses API compatible endpoint
      description: |
        Translates Responses API requests to chat completions. GPT model aliases
        (e.g. `gpt-5-mini`) are mapped to Qwen equivalents.
      tags:
        - Responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  example: gpt-5-mini
                input:
                  description: String or array of input items
                stream:
                  type: boolean
                  default: false
                tools:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Responses API object or SSE stream
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1beta/models:
    get:
      operationId: geminiListModels
      summary: List models in Gemini format
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      responses:
        "200":
          description: Gemini model catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeminiModel"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"

  /v1beta/models/{model}:generateContent:
    post:
      operationId: geminiGenerateContent
      summary: Gemini-compatible non-streaming content generation
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: Gemini or Qwen model id (Gemini families are aliased to Qwen tiers)
          schema:
            type: string
          example: gemini-2.5-pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiGenerateContentRequest"
      responses:
        "200":
          description: Gemini generateContent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiGenerateContentResponse"
        "400":
          $ref: "#/components/responses/GeminiInvalidArgument"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"
        "404":
          $ref: "#/components/responses/GeminiNotFound"
        "429":
          $ref: "#/components/responses/GeminiRateLimited"

  /v1beta/models/{model}:streamGenerateContent:
    post:
      operationId: geminiStreamGenerateContent
      summary: Gemini-compatible streaming content generation (SSE)
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: Gemini or Qwen model id (Gemini families are aliased to Qwen tiers)
          schema:
            type: string
          example: gemini-2.5-flash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiGenerateContentRequest"
      responses:
        "200":
          description: |
            Server-sent events. Each `data:` line is a Gemini
            GenerateContentResponse chunk; the final chunk carries
            `finishReason` and `usageMetadata`.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/GeminiInvalidArgument"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"
        "404":
          $ref: "#/components/responses/GeminiNotFound"
        "429":
          $ref: "#/components/responses/GeminiRateLimited"

  /health:
    get:
      operationId: healthCheck
      summary: Returns service health status
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      operationId: getMetrics
      summary: Returns Prometheus-format metrics
      description: Requires API key auth when `API_KEY` is configured.
      tags:
        - Operations
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP requests_total Total number of requests
                # TYPE requests_total counter
                requests_total 1234

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "OpenAI-style API key: `Authorization: Bearer <key>`"
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: "Bearer-style API key header (same secret as `API_KEY`)"
    geminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: "Gemini-style API key header. The `?key=` query parameter is also accepted on /v1beta routes."

  schemas:
    CreateChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            ID of the model to use. The base model uses Thinking by default;
            append `-fast` to use Qwen's Fast mode without reasoning output.
          example: qwen3-max
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Message"
          description: A list of messages comprising the conversation so far
        stream:
          type: boolean
          default: false
          description: If true, stream partial message deltas via SSE
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature
        top_p:
          type: number
          minimum: 0
          maximum: 1
          description: Nucleus sampling parameter
        max_tokens:
          type: integer
          minimum: 1
          description: Maximum number of tokens to generate
        tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
          description: A list of tools the model may call
        tool_choice:
          oneOf:
            - type: string
              enum: [auto, none, required]
            - $ref: "#/components/schemas/ToolChoice"
          description: Controls which tool is called
        session_id:
          type: string
          description: Optional session identifier for upstream conversation continuity
        conversation_id:
          type: string
          description: Alias for session_id (deprecated, use session_id)

    Message:
      oneOf:
        - $ref: "#/components/schemas/SystemMessage"
        - $ref: "#/components/schemas/UserMessage"
        - $ref: "#/components/schemas/AssistantMessage"
        - $ref: "#/components/schemas/ToolMessage"
      discriminator:
        propertyName: role

    SystemMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system]
        content:
          type: string

    UserMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ContentPart"

    AssistantMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [assistant]
        content:
          type: [string, "null"]
        reasoning_content:
          type: string
          description: Chain-of-thought reasoning (thinking models only)
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    ToolMessage:
      type: object
      required:
        - role
        - content
        - tool_call_id
      properties:
        role:
          type: string
          enum: [tool]
        content:
          type: string
        tool_call_id:
          type: string

    ContentPart:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
        - type: object
          required: [type, image_url]
          properties:
            type:
              type: string
              enum: [image_url]
            image_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: HTTP(S) URL or base64 data URI
        - type: object
          required: [type, video_url]
          properties:
            type:
              type: string
              enum: [video_url]
            video_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string
        - type: object
          required: [type, audio_url]
          properties:
            type:
              type: string
              enum: [audio_url]
            audio_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string
        - type: object
          required: [type, file_url]
          properties:
            type:
              type: string
              enum: [file_url]
            file_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string

    Tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
              description: JSON Schema describing the function parameters

    ToolChoice:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string

    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          description: Unique identifier of the tool call
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
            - arguments
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON-encoded arguments

    CreateChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          example: chatcmpl-abc123
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          format: int64
          description: Unix timestamp (seconds)
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        usage:
          $ref: "#/components/schemas/Usage"

    Choice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finish_reason:
          type: [string, "null"]
          enum: [stop, length, tool_calls, content_filter, null]

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    ChatCompletionStreamResponse:
      type: string
      description: |
        Server-Sent Events stream. Each event is formatted as:
        `data: {json}\n\n`
        The stream terminates with `data: [DONE]\n\n`.
      example: |
        data: {"id":"chatcmpl-abc","object":"chat.completion.chunk","created":1234567890,"model":"qwen3-max","choices":[{"index":0,"delta":{"role":"assistant","content":"Hello"},"finish_reason":null}]}

        data: {"id":"chatcmpl-abc","object":"chat.completion.chunk","created":1234567890,"model":"qwen3-max","choices":[{"index":0,"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}

        data: [DONE]

    StopChatCompletionRequest:
      type: object
      required:
        - chat_id
        - response_id
      properties:
        chat_id:
          type: string
          description: Session identifier of the active stream
        response_id:
          type: string
          description: Response identifier to disambiguate concurrent streams

    StopChatCompletionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum: [true]

    ImageGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: Image generation model selected by the client.
          example: qwen-image-3.0-pro
        prompt:
          type: string
        n:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        size:
          type: string
          enum:
            - auto
            - "1:1"
            - "3:4"
            - "4:3"
            - "16:9"
            - "9:16"
            - 1024x1024
            - 1792x1024
            - 1024x1792
          default: auto
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url
        quality:
          type: string
          description: Accepted for OpenAI compatibility and ignored.

    ImageEditRequest:
      type: object
      required:
        - image
        - prompt
      properties:
        image:
          type: string
          format: binary
          description: Base image to edit. PNG, JPEG, WebP and GIF up to 20MB.
        prompt:
          type: string
        mask:
          type: string
          format: binary
          description: |
            Not supported by the Qwen image edit backend. Providing a mask
            returns 400 with a documented limitation.
        model:
          type: string
          default: qwen-image-3.0-pro
          description: |
            Must support image-to-image editing (`qwen-image-3.0-pro`,
            `qwen-image-3.0`, `wan2.7-image-pro`, `wan2.7-image`). Video
            models and `z-image-turbo` are rejected.
        n:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Number of edits, issued as parallel upstream calls.
        size:
          type: string
          enum:
            - auto
            - "1:1"
            - "3:4"
            - "4:3"
            - "16:9"
            - "9:16"
            - 1024x1024
            - 1792x1024
            - 1024x1792
          description: Accepted for compatibility; not forwarded upstream.
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url

    ImageData:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Present when `response_format` is `url`.
        b64_json:
          type: string
          description: Present when `response_format` is `b64_json`.
        revised_prompt:
          type: string

    ImagesResponse:
      type: object
      properties:
        created:
          type: integer
          description: Unix timestamp (seconds) when the response was created.
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImageData"

    UploadResponse:
      type: object
      required:
        - url
        - file_id
        - filename
        - type
      properties:
        url:
          type: string
          format: uri
          description: Public URL of the uploaded file
        file_id:
          type: string
          description: Qwen file identifier
        filename:
          type: string
          description: Original filename
        type:
          type: string
          enum: [image, video, audio, file]
          description: Media category detected by QwenProxy

    ModelList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    Model:
      type: object
      required:
        - id
        - object
      properties:
        id:
          type: string
          example: qwen3-max
        object:
          type: string
          enum: [model]
        created:
          type: integer
          format: int64
        owned_by:
          type: string
          example: qwen

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
        ram:
          type: string
          enum: [ok, warning, critical, unknown]
          description: Heap pressure vs V8 heap_size_limit
        streams:
          type: string
          enum: [ok, congested, blocked, unknown]
        heap:
          type: object
          properties:
            used:
              type: integer
            total:
              type: integer
            limit:
              type: integer
              description: V8 heap_size_limit (bytes)
            rss:
              type: integer
            usagePercent:
              type: number
              description: heapUsed / heap_size_limit * 100
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (milliseconds)
        metrics:
          type: object
          properties:
            cache:
              type: object
              description: Memory cache statistics

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
              description: Human-readable error description
            type:
              type: string
              description: Error category
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - upstream_error
                - upstream_timeout_error
                - service_unavailable_error
                - internal_error
            code:
              type: [string, "null"]
              description: Machine-readable error code
            param:
              type: [string, "null"]
              description: Request parameter associated with the error, if any

    GeminiPart:
      type: object
      properties:
        text:
          type: string
        thought:
          type: boolean
          description: Thought-summary part emitted for thinking models.
        inlineData:
          type: object
          properties:
            mimeType:
              type: string
            data:
              type: string
              description: Base64-encoded payload.
          required:
            - data
        fileData:
          type: object
          properties:
            mimeType:
              type: string
            fileUri:
              type: string
              format: uri
          required:
            - fileUri
        functionCall:
          type: object
          properties:
            name:
              type: string
            args:
              type: object
              additionalProperties: true
          required:
            - name
        functionResponse:
          type: object
          properties:
            name:
              type: string
            response:
              description: Arbitrary JSON tool result.
          required:
            - name
      additionalProperties: true

    GeminiContent:
      type: object
      required:
        - parts
      properties:
        role:
          type: string
          enum: [user, model, function]
          default: user
        parts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GeminiPart"

    GeminiFunctionDeclaration:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: OpenAPI-subset JSON schema for the function arguments.
        response:
          type: object
          additionalProperties: true

    GeminiTool:
      type: object
      properties:
        functionDeclarations:
          type: array
          items:
            $ref: "#/components/schemas/GeminiFunctionDeclaration"

    GeminiGenerationConfig:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        topK:
          type: integer
          minimum: 0
          description: Forwarded to Qwen but not honored by the web backend.
        candidateCount:
          type: integer
          minimum: 1
          description: Only one candidate is supported; higher values are clamped.
        maxOutputTokens:
          type: integer
          minimum: 1
          description: Enforced by the adapter with a token-estimate guard.
        stopSequences:
          type: array
          items:
            type: string
        presencePenalty:
          type: number
        frequencyPenalty:
          type: number
        seed:
          type: integer
          description: Ignored (reported via X-QwenProxy-Gemini-Warnings).
        responseMimeType:
          type: string
        responseSchema:
          type: object
          additionalProperties: true
        thinkingConfig:
          type: object
          properties:
            thinkingBudget:
              type: integer
              description: 0 forces Fast mode; a positive value forces Thinking.
            includeThoughts:
              type: boolean

    GeminiFunctionCallingConfig:
      type: object
      properties:
        mode:
          type: string
          enum: [AUTO, ANY, NONE, VALIDATED]
        allowedFunctionNames:
          type: array
          items:
            type: string

    GeminiToolConfig:
      type: object
      properties:
        functionCallingConfig:
          $ref: "#/components/schemas/GeminiFunctionCallingConfig"

    GeminiSafetySetting:
      type: object
      properties:
        category:
          type: string
        threshold:
          type: string
      additionalProperties: true

    GeminiGenerateContentRequest:
      type: object
      required:
        - contents
      properties:
        model:
          type: string
          description: Optional; must match the URL model when present.
        contents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GeminiContent"
        systemInstruction:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/GeminiContent"
        generationConfig:
          $ref: "#/components/schemas/GeminiGenerationConfig"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/GeminiTool"
        toolConfig:
          $ref: "#/components/schemas/GeminiToolConfig"
        safetySettings:
          type: array
          items:
            $ref: "#/components/schemas/GeminiSafetySetting"
        cachedContent:
          type: string
          description: Ignored (reported via X-QwenProxy-Gemini-Warnings).
        labels:
          type: object
          additionalProperties:
            type: string
          description: Ignored (reported via X-QwenProxy-Gemini-Warnings).

    GeminiCandidate:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/GeminiContent"
        finishReason:
          type: string
          enum:
            - STOP
            - MAX_TOKENS
            - SAFETY
            - RECITATION
            - BLOCKLIST
            - PROHIBITED_CONTENT
            - SPII
            - MALFORMED_FUNCTION_CALL
            - OTHER
        index:
          type: integer
        safetyRatings:
          type: array
          items:
            type: object

    GeminiUsageMetadata:
      type: object
      properties:
        promptTokenCount:
          type: integer
        candidatesTokenCount:
          type: integer
        totalTokenCount:
          type: integer
        cachedContentTokenCount:
          type: integer
        thoughtsTokenCount:
          type: integer

    GeminiGenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GeminiCandidate"
        usageMetadata:
          $ref: "#/components/schemas/GeminiUsageMetadata"
        modelVersion:
          type: string
        promptFeedback:
          type: object
          properties:
            blockReason:
              type: string
            safetyRatings:
              type: array
              items:
                type: object

    GeminiModel:
      type: object
      properties:
        name:
          type: string
          example: models/qwen3.8-max
        displayName:
          type: string
        description:
          type: string
        inputTokenLimit:
          type: integer
        outputTokenLimit:
          type: integer
        supportedGenerationMethods:
          type: array
          items:
            type: string

    GeminiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - status
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
              example: INVALID_ARGUMENT
            details:
              type: array
              items:
                type: object

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "messages is required and must be a non-empty array"
              type: invalid_request_error
              code: invalid_request
              param: messages
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid API key"
              type: authentication_error
              code: invalid_api_key
              param: null
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Not found"
              type: not_found_error
              code: not_found
              param: null
    RateLimited:
      description: Rate limit exceeded (concurrency or RPM)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Rate limit exceeded (RPM)"
              type: rate_limit_error
              code: rate_limit_exceeded
              param: null
    UpstreamError:
      description: Upstream Qwen service returned an error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Upstream request failed"
              type: upstream_error
              code: upstream_error
              param: null
    ServiceUnavailable:
      description: Service temporarily unavailable (e.g., accounts not ready)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Authentication not ready. Send a chat message first."
              type: service_unavailable_error
              code: service_unavailable
              param: null
    UpstreamTimeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Upstream request timed out"
              type: upstream_timeout_error
              code: upstream_timeout
              param: null
    GeminiInvalidArgument:
      description: Invalid Gemini request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 400
              message: "'contents' array cannot be empty"
              status: INVALID_ARGUMENT
    GeminiUnauthorized:
      description: Missing or invalid Gemini API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 401
              message: "Missing or invalid API key"
              status: UNAUTHENTICATED
    GeminiNotFound:
      description: Unknown Gemini model or method
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 404
              message: "Model 'gemini-unknown' not found"
              status: NOT_FOUND
    GeminiRateLimited:
      description: Gemini request quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 429
              message: "Rate limit exceeded (requests per minute). Retry in 1s."
              status: RESOURCE_EXHAUSTED

tags:
  - name: Chat
    description: Chat completion operations (OpenAI-compatible)
  - name: Responses
    description: OpenAI Responses API compatibility layer
  - name: Gemini
    description: Gemini Generative Language API compatibility layer (/v1beta)
  - name: Models
    description: Model listing and retrieval (OpenAI shape)
  - name: Files
    description: Multimodal file upload (OSS putStream / multipart)
  - name: Operations
    description: Health and metrics endpoints
