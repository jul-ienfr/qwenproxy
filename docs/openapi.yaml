openapi: 3.1.0
info:
  title: QwenProxy API
  description: |
    OpenAI-compatible reverse proxy for Qwen models with account rotation,
    tool calling, multimodal upload, and streaming support.
  version: 1.0.0
  contact:
    name: QwenProxy
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development server

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Creates a model response for the given chat conversation
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatCompletionRequest"
            examples:
              simple:
                summary: Simple text completion
                value:
                  model: qwen3-max
                  messages:
                    - role: user
                      content: Hello
              streaming:
                summary: Streaming response
                value:
                  model: qwen3-max
                  messages:
                    - role: user
                      content: Explain quantum computing
                  stream: true
              multimodal:
                summary: Image input
                value:
                  model: qwen3-vl-max
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image
                        - type: image_url
                          image_url:
                            url: https://example.com/image.jpg
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatCompletionStreamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"

  /v1/chat/completions/stop:
    post:
      operationId: stopChatCompletion
      summary: Abort an in-flight streaming chat completion
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopChatCompletionRequest"
            examples:
              simple:
                summary: Stop one active stream
                value:
                  chat_id: chat_123
                  response_id: resp_123
      responses:
        "200":
          description: Stream stopped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/upload:
    post:
      operationId: uploadFile
      summary: Upload a file to Alibaba Cloud OSS for multimodal prompts
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The file to upload. Supported types: images (png, jpg, gif, webp),
                    video (mp4, mov, avi, webm, mkv), audio (mp3, wav, ogg, flac, m4a, aac),
                    documents (pdf, doc, docx, xls, xlsx, ppt, pptx, txt, md, csv, json, xml, html, zip).
                    Max size: 100MB video, 50MB audio, 20MB other.
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/images/generations:
    post:
      operationId: createImage
      summary: Generate an image from a prompt
      tags:
        - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationRequest"
            examples:
              simple:
                summary: Generate a square image
                value:
                  model: qwen-image-3.0-pro
                  prompt: A red panda reading a book in a library
                  size: "1024x1024"
      responses:
        "200":
          description: Generated image(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/images/edits:
    post:
      operationId: createImageEdit
      summary: Edit an uploaded image with a prompt
      description: |
        Accepts multipart form data with the base `image` and a `prompt`. The
        image is uploaded through the same Qwen OSS path used by
        `/v1/upload` and attached to an upstream `image_edit` chat. The same
        account pool, quotas, cooldowns and captcha recovery as image/video
        generation apply.

        `size` is accepted for OpenAI compatibility but is not forwarded
        upstream. `mask` is not supported by the Qwen backend and is rejected
        with a 400. Upstream moderation failures return
        `400` with `code: content_policy_violation`.
      tags:
        - Images
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageEditRequest"
      responses:
        "200":
          description: Edited image(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/models:
    get:
      operationId: listModels
      summary: Lists the currently available models
      description: |
        OpenAI list format with the synthetic `-fast` variant for every model.
      tags:
        - Models
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: ETag value for conditional GET. Returns 304 if unchanged.
      responses:
        "200":
          description: List of models
          headers:
            ETag:
              schema:
                type: string
              description: MD5-based entity tag (OpenAI format)
            Cache-Control:
              schema:
                type: string
              description: Cache policy (public, max-age=3600)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "304":
          description: Not modified (ETag match)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/models/{model}:
    get:
      operationId: retrieveModel
      summary: Retrieves a model instance by ID
      tags:
        - Models
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
          description: The ID of the model to retrieve
      responses:
        "200":
          description: The model object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/responses:
    post:
      operationId: createResponse
      summary: OpenAI Responses API compatible endpoint
      description: |
        Translates Responses API requests to chat completions. GPT model aliases
        (e.g. `gpt-5-mini`) are mapped to Qwen equivalents.
      tags:
        - Responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  example: gpt-5-mini
                input:
                  description: String or array of input items
                stream:
                  type: boolean
                  default: false
                tools:
                  type: array
                  items:
                    type: object
            examples:
              simple:
                summary: Simple Responses request
                value:
                  model: gpt-5-mini
                  input: Hello
      responses:
        "200":
          description: Responses API object or SSE stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsesObject"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1beta/models:
    get:
      operationId: geminiListModels
      summary: List models in Gemini format
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      responses:
        "200":
          description: Gemini model catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeminiModel"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"

  /v1beta/models/{model}:
    get:
      operationId: geminiGetModel
      summary: Retrieve one model in Gemini format
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: Gemini or Qwen model id
          schema:
            type: string
          example: gemini-2.5-pro
      responses:
        "200":
          description: Gemini model metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiModel"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"
        "404":
          $ref: "#/components/responses/GeminiNotFound"

  /v1beta/models/{model}:generateContent:
    post:
      operationId: geminiGenerateContent
      summary: Gemini-compatible non-streaming content generation
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: Gemini or Qwen model id (Gemini families are aliased to Qwen tiers)
          schema:
            type: string
          example: gemini-2.5-pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiGenerateContentRequest"
            examples:
              simple:
                summary: Simple text prompt
                value:
                  contents:
                    - role: user
                      parts:
                        - text: Hello
      responses:
        "200":
          description: Gemini generateContent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiGenerateContentResponse"
        "400":
          $ref: "#/components/responses/GeminiInvalidArgument"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"
        "404":
          $ref: "#/components/responses/GeminiNotFound"
        "429":
          $ref: "#/components/responses/GeminiRateLimited"

  /v1beta/models/{model}:streamGenerateContent:
    post:
      operationId: geminiStreamGenerateContent
      summary: Gemini-compatible streaming content generation (SSE)
      tags:
        - Gemini
      security:
        - bearerAuth: []
        - apiKeyAuth: []
        - geminiApiKey: []
      parameters:
        - name: model
          in: path
          required: true
          description: Gemini or Qwen model id (Gemini families are aliased to Qwen tiers)
          schema:
            type: string
          example: gemini-2.5-flash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiGenerateContentRequest"
            examples:
              simple:
                summary: Simple text prompt
                value:
                  contents:
                    - role: user
                      parts:
                        - text: Hello
      responses:
        "200":
          description: |
            Server-sent events. Each `data:` line is a Gemini
            GenerateContentResponse chunk; the final chunk carries
            `finishReason` and `usageMetadata`.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/GeminiInvalidArgument"
        "401":
          $ref: "#/components/responses/GeminiUnauthorized"
        "404":
          $ref: "#/components/responses/GeminiNotFound"
        "429":
          $ref: "#/components/responses/GeminiRateLimited"

  /health:
    get:
      operationId: healthCheck
      summary: Returns service health status
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      operationId: getMetrics
      summary: Returns Prometheus-format metrics
      description: Requires API key auth when `API_KEY` is configured.
      tags:
        - Operations
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP requests_total Total number of requests
                # TYPE requests_total counter
                requests_total 1234

  /v1/completions:
    post:
      operationId: createLegacyCompletion
      summary: Legacy OpenAI Completions API adapter
      description: |
        Accepts a legacy text completion request, translates it to a chat
        completion, and returns `text_completion` objects. Streaming uses SSE
        with `text_completion` chunks and a terminal `data: [DONE]`.
      tags:
        - Completions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyCompletionRequest"
            examples:
              simple:
                summary: Legacy text completion
                value:
                  model: qwen3.8-max
                  prompt: Once upon a time
      responses:
        "200":
          description: Legacy completion object or SSE stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/messages:
    post:
      operationId: createAnthropicMessage
      summary: Native Anthropic Messages API
      description: |
        Accepts Anthropic `messages` requests (Claude Code CLI, official SDK)
        and translates them to the internal chat pipeline. Streaming emits
        Anthropic SSE events (`message_start`, `content_block_*`,
        `message_delta`, `message_stop`).
      tags:
        - Anthropic
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
            default: "2023-06-01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessagesRequest"
            examples:
              simple:
                summary: Simple Anthropic message
                value:
                  model: claude-3-7-sonnet-latest
                  max_tokens: 1024
                  messages:
                    - role: user
                      content: Hello
      responses:
        "200":
          description: Anthropic message object or SSE event stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessagesResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/AnthropicBadRequest"
        "401":
          $ref: "#/components/responses/AnthropicUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/AnthropicRateLimited"
        "500":
          $ref: "#/components/responses/AnthropicServerError"

  /v1/messages/count_tokens:
    post:
      operationId: countAnthropicMessageTokens
      summary: Anthropic token counting endpoint
      tags:
        - Anthropic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicCountTokensRequest"
            examples:
              simple:
                summary: Count a short conversation
                value:
                  model: claude-3-7-sonnet-latest
                  messages:
                    - role: user
                      content: Hello
      responses:
        "200":
          description: Estimated input token count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicCountTokensResponse"
        "400":
          $ref: "#/components/responses/AnthropicBadRequest"
        "401":
          $ref: "#/components/responses/AnthropicUnauthorized"

  /v1/responses/{response_id}:
    get:
      operationId: getResponse
      summary: Retrieve a stored Responses API object
      tags:
        - Responses
      parameters:
        - $ref: "#/components/parameters/ResponseId"
      responses:
        "200":
          description: Stored response object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsesObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteResponse
      summary: Delete a stored Responses API object
      tags:
        - Responses
      parameters:
        - $ref: "#/components/parameters/ResponseId"
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/videos/generations:
    post:
      operationId: createVideo
      summary: Generate a video from a prompt
      tags:
        - Videos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGenerationRequest"
            examples:
              simple:
                summary: Short video prompt
                value:
                  model: wan3.0-video
                  prompt: A paper boat drifting down a rainy street
                  size: 1280x720
                  wait: true
      responses:
        "200":
          description: Video task accepted or completed inline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGenerationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/tasks/status/{taskId}:
    get:
      operationId: getVideoTaskStatus
      summary: Poll a video generation task
      tags:
        - Videos
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Block until the task reaches a terminal state or times out.
          schema:
            type: boolean
      responses:
        "200":
          description: Task status and video URL when complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoTaskStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks:
    post:
      operationId: createSpecializedTask
      summary: Start an asynchronous specialized Qwen task
      description: >
        Runs Deep Research, Web Dev, Full-Stack or Slides in the background so
        long generations survive client disconnects. Poll
        `/v1/tasks/{taskId}` for status, progress and the final result.
      tags:
        - Tasks
      parameters:
        - name: X-QwenProxy-Research-Mode
          in: header
          required: false
          schema:
            type: string
            enum: [normal, advance]
          description: >-
            Deep Research pipeline selection; forwarded to the background call.
            Equivalent to the research_mode body field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecializedTaskRequest"
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecializedTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listSpecializedTasks
      summary: List the caller's specialized tasks
      tags:
        - Tasks
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Task list, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecializedTaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/tasks/{taskId}:
    get:
      operationId: getSpecializedTask
      summary: Poll a specialized task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current task state and result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecializedTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: cancelSpecializedTask
      summary: Cancel a queued or running specialized task
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecializedTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/chat/mode:
    get:
      operationId: getChatMode
      summary: Read the runtime conversation mode
      tags:
        - Operations
      responses:
        "200":
          description: Current mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModeResponse"
    post:
      operationId: setChatMode
      summary: Change the runtime conversation mode
      tags:
        - Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatModeUpdateRequest"
      responses:
        "200":
          description: Mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /logs:
    get:
      operationId: getServerLogs
      summary: Read buffered server log entries
      tags:
        - Operations
      responses:
        "200":
          description: Recent log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /logs/live:
    get:
      operationId: streamServerLogs
      summary: Stream live server logs over SSE
      tags:
        - Operations
      responses:
        "200":
          description: SSE stream of log entries
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /diagnostics/tokens:
    get:
      operationId: getTokenDiagnostics
      summary: Inspect upstream cookie and header lifetimes
      tags:
        - Operations
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Token diagnostics per account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDiagnosticsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/UpstreamError"

  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Machine-readable OpenAPI 3.1 contract
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: OpenAPI document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"

  /docs:
    get:
      operationId: getApiDocs
      summary: Interactive API documentation
      description: Self-contained HTML viewer with no external CDN dependencies.
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: HTML documentation page
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "OpenAI-style API key: `Authorization: Bearer <key>`"
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: "Bearer-style API key header (same secret as `API_KEY`)"
    geminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: "Gemini-style API key header. The `?key=` query parameter is also accepted on /v1beta routes."

  parameters:
    ResponseId:
      name: response_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    CreateChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            ID of the model to use. The base model uses Thinking by default;
            append `-fast` to use Qwen's Fast mode without reasoning output.
          example: qwen3-max
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Message"
          description: A list of messages comprising the conversation so far
        stream:
          type: boolean
          default: false
          description: If true, stream partial message deltas via SSE
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature
        top_p:
          type: number
          minimum: 0
          maximum: 1
          description: Nucleus sampling parameter
        max_tokens:
          type: integer
          minimum: 1
          description: Maximum number of tokens to generate
        tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
          description: A list of tools the model may call
        tool_choice:
          oneOf:
            - type: string
              enum: [auto, none, required]
            - $ref: "#/components/schemas/ToolChoice"
          description: Controls which tool is called
        session_id:
          type: string
          description: Optional session identifier for upstream conversation continuity
        conversation_id:
          type: string
          description: Alias for session_id (deprecated, use session_id)

    Message:
      oneOf:
        - $ref: "#/components/schemas/SystemMessage"
        - $ref: "#/components/schemas/UserMessage"
        - $ref: "#/components/schemas/AssistantMessage"
        - $ref: "#/components/schemas/ToolMessage"
      discriminator:
        propertyName: role

    SystemMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system]
        content:
          type: string

    UserMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ContentPart"

    AssistantMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [assistant]
        content:
          type: [string, "null"]
        reasoning_content:
          type: string
          description: Chain-of-thought reasoning (thinking models only)
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    ToolMessage:
      type: object
      required:
        - role
        - content
        - tool_call_id
      properties:
        role:
          type: string
          enum: [tool]
        content:
          type: string
        tool_call_id:
          type: string

    ContentPart:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [text]
            text:
              type: string
        - type: object
          required: [type, image_url]
          properties:
            type:
              type: string
              enum: [image_url]
            image_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: HTTP(S) URL or base64 data URI
        - type: object
          required: [type, video_url]
          properties:
            type:
              type: string
              enum: [video_url]
            video_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string
        - type: object
          required: [type, audio_url]
          properties:
            type:
              type: string
              enum: [audio_url]
            audio_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string
        - type: object
          required: [type, file_url]
          properties:
            type:
              type: string
              enum: [file_url]
            file_url:
              type: object
              required: [url]
              properties:
                url:
                  type: string

    Tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
              description: JSON Schema describing the function parameters

    ToolChoice:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string

    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          description: Unique identifier of the tool call
        type:
          type: string
          enum: [function]
        function:
          type: object
          required:
            - name
            - arguments
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON-encoded arguments

    CreateChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          example: chatcmpl-abc123
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          format: int64
          description: Unix timestamp (seconds)
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        usage:
          $ref: "#/components/schemas/Usage"

    Choice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finish_reason:
          type: [string, "null"]
          enum: [stop, length, tool_calls, content_filter, null]

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    ChatCompletionStreamResponse:
      type: string
      description: |
        Server-Sent Events stream. Each event is formatted as:
        `data: {json}\n\n`
        The stream terminates with `data: [DONE]\n\n`.
      example: |
        data: {"id":"chatcmpl-abc","object":"chat.completion.chunk","created":1234567890,"model":"qwen3-max","choices":[{"index":0,"delta":{"role":"assistant","content":"Hello"},"finish_reason":null}]}

        data: {"id":"chatcmpl-abc","object":"chat.completion.chunk","created":1234567890,"model":"qwen3-max","choices":[{"index":0,"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}

        data: [DONE]

    StopChatCompletionRequest:
      type: object
      required:
        - chat_id
        - response_id
      properties:
        chat_id:
          type: string
          description: Session identifier of the active stream
        response_id:
          type: string
          description: Response identifier to disambiguate concurrent streams

    StopChatCompletionResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum: [true]

    ImageGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: Image generation model selected by the client.
          example: qwen-image-3.0-pro
        prompt:
          type: string
        n:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        size:
          type: string
          enum:
            - auto
            - "1:1"
            - "3:4"
            - "4:3"
            - "16:9"
            - "9:16"
            - 1024x1024
            - 1792x1024
            - 1024x1792
          default: auto
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url
        quality:
          type: string
          description: Accepted for OpenAI compatibility and ignored.

    ImageEditRequest:
      type: object
      required:
        - image
        - prompt
      properties:
        image:
          type: string
          format: binary
          description: Base image to edit. PNG, JPEG, WebP and GIF up to 20MB.
        prompt:
          type: string
        mask:
          type: string
          format: binary
          description: |
            Not supported by the Qwen image edit backend. Providing a mask
            returns 400 with a documented limitation.
        model:
          type: string
          default: qwen-image-3.0-pro
          description: |
            Must support image-to-image editing (`qwen-image-3.0-pro`,
            `qwen-image-3.0`, `wan2.7-image-pro`, `wan2.7-image`). Video
            models and `z-image-turbo` are rejected.
        n:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Number of edits, issued as parallel upstream calls.
        size:
          type: string
          enum:
            - auto
            - "1:1"
            - "3:4"
            - "4:3"
            - "16:9"
            - "9:16"
            - 1024x1024
            - 1792x1024
            - 1024x1792
          description: Accepted for compatibility; not forwarded upstream.
        response_format:
          type: string
          enum:
            - url
            - b64_json
          default: url

    ImageData:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Present when `response_format` is `url`.
        b64_json:
          type: string
          description: Present when `response_format` is `b64_json`.
        revised_prompt:
          type: string

    ImagesResponse:
      type: object
      properties:
        created:
          type: integer
          description: Unix timestamp (seconds) when the response was created.
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImageData"

    UploadResponse:
      type: object
      required:
        - url
        - file_id
        - filename
        - type
      properties:
        url:
          type: string
          format: uri
          description: Public URL of the uploaded file
        file_id:
          type: string
          description: Qwen file identifier
        filename:
          type: string
          description: Original filename
        type:
          type: string
          enum: [image, video, audio, file]
          description: Media category detected by QwenProxy

    ModelList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    Model:
      type: object
      required:
        - id
        - object
      properties:
        id:
          type: string
          example: qwen3-max
        object:
          type: string
          enum: [model]
        created:
          type: integer
          format: int64
        owned_by:
          type: string
          example: qwen

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
        ram:
          type: string
          enum: [ok, warning, critical, unknown]
          description: Heap pressure vs V8 heap_size_limit
        streams:
          type: string
          enum: [ok, congested, blocked, unknown]
        heap:
          type: object
          properties:
            used:
              type: integer
            total:
              type: integer
            limit:
              type: integer
              description: V8 heap_size_limit (bytes)
            rss:
              type: integer
            usagePercent:
              type: number
              description: heapUsed / heap_size_limit * 100
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (milliseconds)
        metrics:
          type: object
          properties:
            cache:
              type: object
              description: Memory cache statistics

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
              description: Human-readable error description
            type:
              type: string
              description: Error category
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - upstream_error
                - upstream_timeout_error
                - service_unavailable_error
                - internal_error
            code:
              type: [string, "null"]
              description: Machine-readable error code
            param:
              type: [string, "null"]
              description: Request parameter associated with the error, if any

    GeminiPart:
      type: object
      properties:
        text:
          type: string
        thought:
          type: boolean
          description: Thought-summary part emitted for thinking models.
        inlineData:
          type: object
          properties:
            mimeType:
              type: string
            data:
              type: string
              description: Base64-encoded payload.
          required:
            - data
        fileData:
          type: object
          properties:
            mimeType:
              type: string
            fileUri:
              type: string
              format: uri
          required:
            - fileUri
        functionCall:
          type: object
          properties:
            name:
              type: string
            args:
              type: object
              additionalProperties: true
          required:
            - name
        functionResponse:
          type: object
          properties:
            name:
              type: string
            response:
              description: Arbitrary JSON tool result.
          required:
            - name
      additionalProperties: true

    GeminiContent:
      type: object
      required:
        - parts
      properties:
        role:
          type: string
          enum: [user, model, function]
          default: user
        parts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GeminiPart"

    GeminiFunctionDeclaration:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: OpenAPI-subset JSON schema for the function arguments.
        response:
          type: object
          additionalProperties: true

    GeminiTool:
      type: object
      properties:
        functionDeclarations:
          type: array
          items:
            $ref: "#/components/schemas/GeminiFunctionDeclaration"

    GeminiGenerationConfig:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        topK:
          type: integer
          minimum: 0
          description: Forwarded to Qwen but not honored by the web backend.
        candidateCount:
          type: integer
          minimum: 1
          description: Only one candidate is supported; higher values are clamped.
        maxOutputTokens:
          type: integer
          minimum: 1
          description: Enforced by the adapter with a token-estimate guard.
        stopSequences:
          type: array
          items:
            type: string
        presencePenalty:
          type: number
        frequencyPenalty:
          type: number
        seed:
          type: integer
          description: Ignored (reported via X-QwenProxy-Gemini-Warnings).
        responseMimeType:
          type: string
        responseSchema:
          type: object
          additionalProperties: true
        thinkingConfig:
          type: object
          properties:
            thinkingBudget:
              type: integer
              description: 0 forces Fast mode; a positive value forces Thinking.
            includeThoughts:
              type: boolean

    GeminiFunctionCallingConfig:
      type: object
      properties:
        mode:
          type: string
          enum: [AUTO, ANY, NONE, VALIDATED]
        allowedFunctionNames:
          type: array
          items:
            type: string

    GeminiToolConfig:
      type: object
      properties:
        functionCallingConfig:
          $ref: "#/components/schemas/GeminiFunctionCallingConfig"

    GeminiSafetySetting:
      type: object
      properties:
        category:
          type: string
        threshold:
          type: string
      additionalProperties: true

    GeminiGenerateContentRequest:
      type: object
      required:
        - contents
      properties:
        model:
          type: string
          description: Optional; must match the URL model when present.
        contents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GeminiContent"
        systemInstruction:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/GeminiContent"
        generationConfig:
          $ref: "#/components/schemas/GeminiGenerationConfig"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/GeminiTool"
        toolConfig:
          $ref: "#/components/schemas/GeminiToolConfig"
        safetySettings:
          type: array
          items:
            $ref: "#/components/schemas/GeminiSafetySetting"
        cachedContent:
          type: string
          description: Ignored (reported via X-QwenProxy-Gemini-Warnings).
        labels:
          type: object
          additionalProperties:
            type: string
          description: Ignored (reported via X-QwenProxy-Gemini-Warnings).

    GeminiCandidate:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/GeminiContent"
        finishReason:
          type: string
          enum:
            - STOP
            - MAX_TOKENS
            - SAFETY
            - RECITATION
            - BLOCKLIST
            - PROHIBITED_CONTENT
            - SPII
            - MALFORMED_FUNCTION_CALL
            - OTHER
        index:
          type: integer
        safetyRatings:
          type: array
          items:
            type: object

    GeminiUsageMetadata:
      type: object
      properties:
        promptTokenCount:
          type: integer
        candidatesTokenCount:
          type: integer
        totalTokenCount:
          type: integer
        cachedContentTokenCount:
          type: integer
        thoughtsTokenCount:
          type: integer

    GeminiGenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GeminiCandidate"
        usageMetadata:
          $ref: "#/components/schemas/GeminiUsageMetadata"
        modelVersion:
          type: string
        promptFeedback:
          type: object
          properties:
            blockReason:
              type: string
            safetyRatings:
              type: array
              items:
                type: object

    GeminiModel:
      type: object
      properties:
        name:
          type: string
          example: models/qwen3.8-max
        displayName:
          type: string
        description:
          type: string
        inputTokenLimit:
          type: integer
        outputTokenLimit:
          type: integer
        supportedGenerationMethods:
          type: array
          items:
            type: string

    GeminiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - status
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
              example: INVALID_ARGUMENT
            details:
              type: array
              items:
                type: object

    AnthropicContentBlock:
      type: object
      properties:
        type:
          type: string
          enum: [text, tool_use, tool_result, image, document, thinking]
        text:
          type: string
        id:
          type: string
        name:
          type: string
        input:
          type: object
          additionalProperties: true
        tool_use_id:
          type: string
        content:
          description: String or nested content blocks.
        is_error:
          type: boolean
        source:
          type: object
          properties:
            type:
              type: string
            media_type:
              type: string
            data:
              type: string
        thinking:
          type: string
      additionalProperties: true

    AnthropicMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicContentBlock"

    AnthropicTool:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true

    AnthropicMessagesRequest:
      type: object
      required:
        - model
        - max_tokens
        - messages
      properties:
        model:
          type: string
          example: claude-3-7-sonnet-latest
        max_tokens:
          type: integer
          minimum: 1
        system:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicContentBlock"
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AnthropicMessage"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicTool"
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          properties:
            type:
              type: string
              enum: [enabled, disabled]
            budget_tokens:
              type: integer
        stream:
          type: boolean
          default: false
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer

    AnthropicUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer

    AnthropicMessagesResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        model:
          type: string
        content:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicContentBlock"
        stop_reason:
          type: [string, "null"]
        stop_sequence:
          type: [string, "null"]
        usage:
          $ref: "#/components/schemas/AnthropicUsage"

    AnthropicCountTokensRequest:
      type: object
      required:
        - messages
      properties:
        model:
          type: string
        system:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicContentBlock"
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AnthropicMessage"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicTool"

    AnthropicCountTokensResponse:
      type: object
      required:
        - input_tokens
      properties:
        input_tokens:
          type: integer

    AnthropicError:
      type: object
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum: [error]
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              example: invalid_request_error
            message:
              type: string
        request_id:
          type: string

    ResponsesObject:
      type: object
      required:
        - id
        - object
        - status
      properties:
        id:
          type: string
          example: resp_123
        object:
          type: string
          enum: [response]
        created_at:
          type: integer
        status:
          type: string
          enum: [in_progress, completed, failed, cancelled, incomplete]
        model:
          type: string
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        output_text:
          type: string
        usage:
          type: object
          additionalProperties: true
        error:
          type: [object, "null"]
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    ResponseDeleteResponse:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
          example: resp_123
        object:
          type: string
          enum: [response.deleted]
        deleted:
          type: boolean
          example: true

    LegacyCompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          example: qwen3.8-max
        prompt:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
        top_p:
          type: number
        stream:
          type: boolean
          default: false
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        presence_penalty:
          type: number
        frequency_penalty:
          type: number

    LegacyCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum: [text_completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
              logprobs:
                type: [object, "null"]
              finish_reason:
                type: [string, "null"]
        usage:
          $ref: "#/components/schemas/Usage"

    VideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          example: wan3.0-video
        prompt:
          type: string
        size:
          type: string
          description: Aspect ratio or pixel size accepted by the media backend.
        wait:
          type: boolean
          default: true
          description: Block until the task completes when possible.
      additionalProperties: true

    VideoGenerationResponse:
      type: object
      properties:
        created:
          type: integer
        task_id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
        video_url:
          type: [string, "null"]
      additionalProperties: true

    VideoTaskStatusResponse:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        video_url:
          type: [string, "null"]
          format: uri
        created:
          type: integer
      additionalProperties: true

    SpecializedTaskRequest:
      type: object
      required:
        - model
      properties:
        model:
          type: string
          enum:
            - qwen-deep-research
            - qwen-web-dev
            - qwen-full-stack
            - qwen-slides
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        stream:
          type: boolean
          description: Ignored. Tasks always run in the background.
        research_mode:
          type: string
          enum: [normal, advance]
          description: Deep Research pipeline selection.
      additionalProperties: true

    SpecializedTaskArtifact:
      type: object
      properties:
        type:
          type: string
          enum: [report, pdf, image, code, link]
        url:
          type: string
          format: uri
        title:
          type: string
      additionalProperties: true

    SpecializedTaskResult:
      type: object
      properties:
        content:
          type: string
        citations:
          type: array
          description: Validated source URLs found in the final content.
          items:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                format: uri
              title:
                type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/SpecializedTaskArtifact"
        usage:
          $ref: "#/components/schemas/Usage"
      additionalProperties: true

    SpecializedTask:
      type: object
      required:
        - id
        - object
        - model
        - status
      properties:
        id:
          type: string
        object:
          type: string
          enum: [specialized.task]
        model:
          type: string
        mode:
          type: string
          enum: [research, artifact, slides]
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: integer
        updated_at:
          type: integer
        result:
          oneOf:
            - $ref: "#/components/schemas/SpecializedTaskResult"
            - type: "null"
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  description: >-
                    Stable code such as task_timeout, task_cancelled or
                    interrupted.
                message:
                  type: string
            - type: "null"
      additionalProperties: true

    SpecializedTaskList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpecializedTask"

    ChatModeResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [thread, thread-temp, stateless-temp, stateless]
        success:
          type: boolean

    ChatModeUpdateRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum: [thread, thread-temp, stateless-temp, stateless]

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        context:
          type: object
          additionalProperties: true
      additionalProperties: true

    TokenDiagnosticsResponse:
      type: object
      properties:
        cookies:
          type: array
          items:
            type: object
            additionalProperties: true
        headers:
          type: array
          items:
            type: object
            additionalProperties: true
        summary:
          type: object
          properties:
            totalCookies:
              type: integer
            sessionCookies:
              type: integer
            shortestTtlMin:
              type: [integer, "null"]
            shortestTtlCookie:
              type: [string, "null"]
      additionalProperties: true

    OpenApiDocument:
      type: object
      required:
        - openapi
        - info
        - paths
      properties:
        openapi:
          type: string
          example: 3.1.0
        info:
          type: object
        paths:
          type: object
        components:
          type: object

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "messages is required and must be a non-empty array"
              type: invalid_request_error
              code: invalid_request
              param: messages
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid API key"
              type: authentication_error
              code: invalid_api_key
              param: null
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Not found"
              type: not_found_error
              code: not_found
              param: null
    RateLimited:
      description: Rate limit exceeded (concurrency, RPM, or active specialized tasks)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Rate limit exceeded (RPM)"
              type: rate_limit_error
              code: rate_limit_exceeded
              param: null
    UpstreamError:
      description: Upstream Qwen service returned an error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Upstream request failed"
              type: upstream_error
              code: upstream_error
              param: null
    ServiceUnavailable:
      description: Service temporarily unavailable (e.g., accounts not ready)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Authentication not ready. Send a chat message first."
              type: service_unavailable_error
              code: service_unavailable
              param: null
    UpstreamTimeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Upstream request timed out"
              type: upstream_timeout_error
              code: upstream_timeout
              param: null
    GeminiInvalidArgument:
      description: Invalid Gemini request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 400
              message: "'contents' array cannot be empty"
              status: INVALID_ARGUMENT
    GeminiUnauthorized:
      description: Missing or invalid Gemini API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 401
              message: "Missing or invalid API key"
              status: UNAUTHENTICATED
    GeminiNotFound:
      description: Unknown Gemini model or method
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 404
              message: "Model 'gemini-unknown' not found"
              status: NOT_FOUND
    GeminiRateLimited:
      description: Gemini request quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiError"
          example:
            error:
              code: 429
              message: "Rate limit exceeded (requests per minute). Retry in 1s."
              status: RESOURCE_EXHAUSTED
    AnthropicBadRequest:
      description: Invalid Anthropic request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: invalid_request_error
              message: "max_tokens: Field required"
    AnthropicUnauthorized:
      description: Missing or invalid Anthropic credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: authentication_error
              message: "Invalid API key"
    AnthropicRateLimited:
      description: Anthropic request quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: rate_limit_error
              message: "Rate limit exceeded (requests per minute). Retry in 1s."
    AnthropicServerError:
      description: Anthropic upstream or internal failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: api_error
              message: "Upstream request failed"

tags:
  - name: Chat
    description: Chat completion operations (OpenAI-compatible)
  - name: Completions
    description: Legacy OpenAI text completions adapter
  - name: Anthropic
    description: Native Anthropic Messages API
  - name: Responses
    description: OpenAI Responses API compatibility layer
  - name: Gemini
    description: Gemini Generative Language API compatibility layer (/v1beta)
  - name: Models
    description: Model listing and retrieval (OpenAI shape)
  - name: Files
    description: Multimodal file upload (OSS putStream / multipart)
  - name: Images
    description: Image generation and editing
  - name: Videos
    description: Video generation and task polling
  - name: Operations
    description: Health, metrics, logs, mode switching and API documentation
